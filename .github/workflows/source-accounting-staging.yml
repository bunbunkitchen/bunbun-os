name: Source accounting — isolated PostgreSQL
on:
  pull_request:
    paths:
      - 'docs/sql/cloud-*.sql'
      - 'docs/sql/staging-production-baseline.sql'
      - 'tests/sql/cloud-*.sql'
      - 'tests/sql/source-accounting-*.sql'
      - 'tests/sql/source-settlement-*'
      - 'tests/sql/source-material-*'
      - 'tests/sql/source-production-*'
      - 'tests/sql/source-product-flow-*'
      - 'tests/accounting*Review.test.js'
      - 'supabase/functions/_shared/accounting*Review.js'
      - 'supabase/functions/accounting-purchase/**'
      - 'supabase/functions/accounting-expense/**'
      - 'supabase/functions/accounting-revenue/**'
      - 'supabase/functions/accounting-material/**'
      - 'supabase/functions/accounting-production/**'
      - 'supabase/functions/accounting-product-flow/**'
      - 'supabase/functions/accounting-cafe-report/**'
      - 'supabase/functions/_shared/accountingCafeReport.js'
      - 'tests/sql/source-cafe-report-*'
      - '.github/workflows/source-accounting-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-posting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: bunbun_source_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bunbun_source_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_ci_only
      PGDATABASE: bunbun_source_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test signed Owner review and all existing JS guards
        run: node --test tests/*.test.js
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Load actual source schema and reviewed posting SQL in local CI only
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/source-accounting-local-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/staging-production-baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-ledger-core-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-stock-writers-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-purchase-posting-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-purchase-correction-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-purchase-service-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-period-expense-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-sale-settlement-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-material-wip-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-production-cost-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-product-cost-flow-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/cloud-cafe-report-staging.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/source-accounting-local-seed.sql
      - name: Test real-source purchasing, corrections and period expenses
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/cloud-purchase-posting-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/cloud-purchase-correction-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/cloud-period-expense-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/cloud-sale-settlement-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/cloud-material-wip-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/cloud-production-cost-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/cloud-product-cost-flow-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/cloud-cafe-report-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF EXISTS(SELECT 1 FROM public.expenses) OR EXISTS(SELECT 1 FROM public.purchases) OR EXISTS(SELECT 1 FROM bunbun_accounting.journals) THEN RAISE EXCEPTION 'Test fixtures escaped rollback'; END IF; END \$\$;"
      - name: Test simultaneous material usage in a separate disposable database
        env:
          BUNBUN_SOURCE_ACCOUNTING_CI: isolated-local
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bunbun_material_ci TEMPLATE bunbun_source_ci'
          PGDATABASE=bunbun_material_ci bash tests/sql/source-material-race.sh
      - name: Test simultaneous allocations of one production payment
        env:
          BUNBUN_SOURCE_ACCOUNTING_CI: isolated-local
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bunbun_production_ci TEMPLATE bunbun_source_ci'
          PGDATABASE=bunbun_production_ci bash tests/sql/source-production-race.sh
      - name: Test simultaneous sold-cost posting against one valued lot
        env:
          BUNBUN_SOURCE_ACCOUNTING_CI: isolated-local
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bunbun_product_flow_ci TEMPLATE bunbun_source_ci'
          PGDATABASE=bunbun_product_flow_ci bash tests/sql/source-product-flow-race.sh
      - name: Test simultaneous cafe reports sharing one net receipt
        env:
          BUNBUN_SOURCE_ACCOUNTING_CI: isolated-local
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bunbun_cafe_report_ci TEMPLATE bunbun_source_ci'
          PGDATABASE=bunbun_cafe_report_ci bash tests/sql/source-cafe-report-race.sh
      - name: Test simultaneous receipt allocations in two independent sessions
        env:
          BUNBUN_SOURCE_ACCOUNTING_CI: isolated-local
        run: bash tests/sql/source-settlement-race.sh
