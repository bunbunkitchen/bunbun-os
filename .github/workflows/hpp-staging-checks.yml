  edge-owner-auth:
    name: Staging Owner Edge typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked packages for Deno npm resolver
        run: npm ci --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck staging-only Edge Function
        run: deno check supabase/functions/accounting-cafe-ledger/index.ts supabase/functions/accounting-cafe-report/index.ts supabase/functions/accounting-product-flow/index.ts supabase/functions/accounting-production/index.ts supabase/functions/accounting-material/index.ts supabase/functions/accounting-revenue/index.ts supabase/functions/accounting-expense/index.ts supabase/functions/accounting-purchase/index.ts supabase/functions/accounting-owner-readiness/index.ts supabase/functions/accounting-owner-monthly-report/index.ts supabase/functions/accounting-owner-source-preview/index.ts
