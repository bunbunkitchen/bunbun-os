name: HPP staging validation

on:
  pull_request:
    paths:
      - "src/pages/finance/HppAudit.jsx"
      - "src/services/batchCostingReadService.js"
      - "src/services/hppAuditService.js"
      - "src/utils/hpp*.js"
      - "src/routes/AppRoutes.jsx"
      - "src/components/layout/Sidebar.jsx"
      - "tests/hpp*.test.js"
      - ".github/workflows/hpp-staging-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: HPP unit tests
        run: node --test tests/hpp*.test.js
      - name: HPP lint
        run: npx eslint src/utils/hppBatchAssessment.js src/utils/hppCostReview.js src/utils/hppMonthlyAllocation.js src/services/batchCostingReadService.js src/services/hppAuditService.js src/pages/finance/HppAudit.jsx src/routes/AppRoutes.jsx src/components/layout/Sidebar.jsx
      - name: Production build
        run: npm run build
